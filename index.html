<!doctype html>

<title>Legal · Sprig</title><style>
:root{--ink:#1d2b22;--soft:#4a5a4f;--leaf:#2f5d43;--moss:#e7eee2;--paper:#fbf9f3;--line:#dfe5d8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 22px 64px}
header{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--leaf);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
header span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--leaf)}

h2{font-size:21px;margin:36px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:22px 0 6px}
p,li{color:var(--soft)}
strong{color:var(--ink)}
a{color:var(--leaf)}
code{background:var(--moss);padding:1px 6px;border-radius:6px;font-size:14px}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}
th{background:var(--moss);color:var(--ink)}
nav{display:flex;gap:16px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
.cards a{display:block;padding:18px 20px;margin:12px 0;background:#fff;border:1px solid var(--line);border-radius:16px;text-decoration:none;font-weight:600}
